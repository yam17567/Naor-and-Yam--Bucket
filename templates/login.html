<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>התחברות - Naor&Yam Bucket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="landing">
<main id="main-container">
    <div class="welcome-header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="לוגו" class="login-logo">
        <h1>Welcome to Naor & Yam - Bucket 💕</h1>
    </div>

    <!-- הודעות שגיאה/הצלחה -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <label for="member_pin">🔑 הכנס קוד משתמש אישי:</label>
        <input id="member_pin" name="member_pin" type="text" placeholder="למשל: 12" required>

        <br><br>
        <!-- כפתור הסימון "זכור אותי" -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px;">
            <input type="checkbox" id="remember_me" name="remember_me" checked style="width: 18px; height: 18px; cursor: pointer;">
            <label for="remember_me" style="cursor: pointer; font-size: 0.95em;">זכור אותי במכשיר זה 🔒</label>
        </div>

        <button type="submit" id="login-btn">התחברות 🚀</button>
    </form>

    <br>
    <form action="{{ url_for('create_group_form') }}">
        <button id="new_group-btn">➕ יצירת קבוצה / הצטרפות</button>
    </form>
</main>
</body>
</html>
