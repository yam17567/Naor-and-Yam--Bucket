<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה / הצטרפות</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        function toggleFormMode() {
            const mode = document.getElementById("action_type").value;
            const joinSection = document.getElementById("join-section");
            const createSection = document.getElementById("create-section");

            if (mode === "join") {
                joinSection.style.display = "block";
                createSection.style.display = "none";
                document.getElementById("existing_group_pin").required = true;
                document.getElementById("new_group_name").required = false;
                document.getElementById("new_group_pin").required = false;
            } else {
                joinSection.style.display = "none";
                createSection.style.display = "block";
                document.getElementById("existing_group_pin").required = false;
                document.getElementById("new_group_name").required = true;
                document.getElementById("new_group_pin").required = true;
            }
        }
    </script>
</head>
<body class="signup-body">
<main id="signup-container" style="max-width: 450px; margin: 40px auto; padding: 25px; background: rgba(255, 255, 255, 0.95); border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
    <h1 style="text-align: center; margin-bottom: 20px;">הרשמה למערכת 🌸</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message" style="background:#ffebee; color:#c62828; padding:10px; border-radius:8px; margin-bottom:15px; text-align: center;">
          {% for message in messages %}
            <p style="margin:0;">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/create_group">
        <!-- 1. פרטי המשתמש הבודד -->
        <h3 style="color: #333; margin-top: 0;">1. הפרטים האישיים שלך:</h3>

        <label style="display: block; margin-top: 10px; font-weight: bold;">שמך:</label>
        <input type="text" name="member_name" placeholder="למשל: ים" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc;">

        <label style="display: block; margin-top: 15px; font-weight: bold;">קוד משתמש אישי להתחברות:</label>
        <p style="font-size:0.85em; color:#555; margin:3px 0 6px 0;">
           💡 רמז: הקוד החופשי הקטן ביותר כרגע במערכת הוא <b>{{ suggested_pin }}</b>
        </p>
        <input type="text" name="member_pin" placeholder="למשל: {{ suggested_pin }}" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

        <!-- 2. קבוצה (יצירה / הצטרפות) -->
        <h3 style="color: #333;">2. הקבוצה שלך:</h3>

        <label for="action_type" style="display: block; margin-top: 10px; font-weight: bold;">מה ברצונך לעשות?</label>
        <select id="action_type" name="action_type" onchange="toggleFormMode()" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; font-size: 1em;">
            <option value="join">להצטרף לקבוצה קיימת 👥</option>
            <option value="create">ליצור קבוצה חדשה מאפס ✨</option>
        </select>

        <!-- אופציה א': הצטרפות לקבוצה קיימת -->
        <div id="join-section" style="margin-top: 15px;">
            <label style="display: block; font-weight: bold;">הכנס קוד קבוצה קיימת:</label>
            <input type="text" id="existing_group_pin" name="existing_group_pin" placeholder="למשל: 1001" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <!-- אופציה ב': יצירת קבוצה חדשה -->
        <div id="create-section" style="display: none; margin-top: 15px;">
            <label style="display: block; font-weight: bold;">שם הקבוצה החדשה:</label>
            <input type="text" id="new_group_name" name="new_group_name" placeholder="למשל: נעור & ים" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc;">

            <label style="display: block; margin-top: 10px; font-weight: bold;">קוד הקבוצה החדשה (לתת לשותף להתחברות):</label>
            <input type="text" id="new_group_pin" name="new_group_pin" placeholder="למשל: 555" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <br><br>
        <button type="submit" style="width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer;">סיום הרשמה 🚀</button>
    </form>

    <br>
    <div style="text-align: center;">
        <a href="{{ url_for('home') }}" style="color: #555; text-decoration: none;">🔙 חזרה לדף ההתחברות</a>
    </div>
</main>
</body>
</html>
